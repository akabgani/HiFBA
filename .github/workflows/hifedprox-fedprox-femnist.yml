name: HiFedProx FedProx FEMNIST benchmark

on:
  push:
    branches: [hifedprox-fedprox-femnist]
  workflow_dispatch:

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        drop: ['0', '0.5', '0.9']
        method: ['fedavg', 'fedprox', 'hifedprox']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy gdown
      - name: Download official FedProx FEMNIST archive
        run: |
          gdown 1tCEcJgRJ8NdRo11UJZR6WSKMNdmox4GC -O femnist.zip
          mkdir -p femnist_data
          unzip -q femnist.zip -d femnist_data
      - name: Locate data and run benchmark
        run: |
          TRAIN=$(find femnist_data -type f -name 'mytrain.json' | head -1)
          TEST=$(find femnist_data -type f -name 'mytest.json' | head -1)
          if [ -z "$TRAIN" ] || [ -z "$TEST" ]; then
            echo 'Could not locate mytrain.json/mytest.json'; find femnist_data -type f | head -100; exit 2
          fi
          echo "TRAIN=$TRAIN"
          echo "TEST=$TEST"
          echo "DROP=${{ matrix.drop }} METHOD=${{ matrix.method }}"
          python experiments/hifedprox_fedprox_femnist.py \
            --train "$TRAIN" --test "$TEST" --out results \
            --rounds 200 --clients-per-round 10 --epochs 20 --batch-size 10 \
            --lr 0.003 --mu 1.0 --power 6 --num-classes 26 \
            --seeds 0 --drops ${{ matrix.drop }} --methods ${{ matrix.method }} \
            --pilot-rounds 20 --eval-every 5
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hifedprox-fedprox-femnist-${{ matrix.method }}-drop-${{ matrix.drop }}
          path: results/
          if-no-files-found: warn
