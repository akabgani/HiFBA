name: Final HiFedProx vs FedProx FEMNIST comparison

on:
  push:
    branches: [hifedprox-fedprox-femnist]
    paths:
      - '.github/workflows/final-hifedprox-fedprox-femnist.yml'
  workflow_dispatch:

jobs:
  final:
    strategy:
      fail-fast: false
      matrix:
        drop: ['0', '0.5', '0.9']
        method: ['fedavg', 'fedprox', 'hifedprox']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy gdown
      - name: Download official FedProx FEMNIST archive
        run: |
          gdown 1tCEcJgRJ8NdRo11UJZR6WSKMNdmox4GC -O femnist.zip
          mkdir -p femnist_data
          unzip -q femnist.zip -d femnist_data
      - name: Run frozen comparison
        run: |
          TRAIN=$(find femnist_data -type f -name 'mytrain.json' | head -1)
          TEST=$(find femnist_data -type f -name 'mytest.json' | head -1)
          python experiments/final_hifedprox_fedprox_femnist.py \
            --train "$TRAIN" --test "$TEST" --out final_results \
            --method ${{ matrix.method }} --drop ${{ matrix.drop }} \
            --rounds 200 --clients-per-round 10 --epochs 20 --batch-size 10 \
            --lr 0.003 --num-classes 26 --seeds 8 9 10 11 12 --eval-every 5
      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ matrix.method }}-drop-${{ matrix.drop }}
          path: final_results/
