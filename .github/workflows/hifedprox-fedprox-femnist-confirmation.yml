name: HiFedProx FEMNIST independent confirmation

on:
  push:
    branches: [hifedprox-fedprox-femnist]
    paths:
      - '.github/workflows/hifedprox-fedprox-femnist-confirmation.yml'
  workflow_dispatch:

jobs:
  confirm:
    strategy:
      fail-fast: false
      matrix:
        validation_seed: ['20261028', '20261029']
        config: ['fedprox', 'hifedprox']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy gdown
      - name: Download official FedProx FEMNIST archive
        run: |
          gdown 1tCEcJgRJ8NdRo11UJZR6WSKMNdmox4GC -O femnist.zip
          mkdir -p femnist_data
          unzip -q femnist.zip -d femnist_data
      - name: Confirm frozen candidates on new training-only split
        run: |
          TRAIN=$(find femnist_data -type f -name 'mytrain.json' | head -1)
          if [ "${{ matrix.config }}" = "fedprox" ]; then P=2; RS=1.0; MU=1.0; else P=3; RS=0.50; MU=2.0; fi
          python experiments/calibrate_hifedprox_femnist.py \
            --train "$TRAIN" --out confirmation \
            --power $P --r-scale $RS --mu $MU \
            --validation-fraction 0.15 --validation-seed ${{ matrix.validation_seed }} \
            --rounds 200 --clients-per-round 10 --epochs 20 --batch-size 10 \
            --lr 0.003 --num-classes 26 --drop 0.9 \
            --seeds 3 4 5 6 7 --pilot-rounds 20 --eval-every 10
      - uses: actions/upload-artifact@v4
        with:
          name: confirm-${{ matrix.config }}-v${{ matrix.validation_seed }}
          path: confirmation/
